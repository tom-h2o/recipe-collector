# Minimal local config for `supabase start` in CI, which is what makes the RLS
# tests in supabase/tests/ runnable. Only the database matters here — the
# studio, storage and realtime services are disabled to keep the job short.
project_id = "recipe-collector"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[inbucket]
enabled = false

[analytics]
enabled = false
