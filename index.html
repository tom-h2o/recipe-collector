<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The ICO first, for Safari (which has not reliably shown SVG favicons) and
      older browsers; sizes="32x32" lets the others prefer the SVG below. Both
      are drawn for 16 px: the key fills the tile, with thick strokes. The
      earlier one was the header logo shrunk onto a tile, and at tab size it
      was a few faint pixels.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No manifest link here: vite-plugin-pwa injects its own
      (/manifest.webmanifest) at build time. A hand-written public/manifest.json
      used to sit alongside it, and because the browser takes the FIRST manifest
      link it won — which is why the installed app kept calling itself "Recipe
      Vault" in an orange theme long after the rename.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#315f3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Speisekammer" />
    <title>Speisekammer — Your Curated Recipe Vault</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
