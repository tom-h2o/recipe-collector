name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "develop", "staging" ]
  pull_request:
    branches: [ "master", "main", "develop", "staging" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validation (Staging) Environment
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript Check
      run: npx tsc --noEmit
      
    - name: Run Unit & Integration Tests
      run: npm run test

    - name: Build project
      run: npm run build

    # Apply Staging/Validation database migrations on develop/staging branches or PRs
    - name: Link Staging Database
      if: (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main') && github.event_name == 'push'
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

    - name: Apply Staging/Validation Migrations
      if: (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main') && github.event_name == 'push'
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase db push

    # Optional Vercel Staging Deployment (Runs if secrets are configured)
    - name: Deploy Staging to Vercel
      if: (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main') && github.event_name == 'push'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        if [ -n "$VERCEL_TOKEN" ]; then
          npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          npx vercel build --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --token=$VERCEL_TOKEN
        else
          echo "VERCEL_TOKEN not configured. Skipping staging preview deployment."
        fi

  deploy-production:
    name: Production Environment Deployment
    needs: validate
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    # Apply Production database migrations before executing Playwright E2E checks
    - name: Link Production Database
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase link --project-ref ${{ secrets.SUPABASE_PRODUCTION_PROJECT_ID }}

    - name: Apply Production Migrations
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase db push

    # Production Deployment on Vercel
    - name: Deploy Production to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        if [ -n "$VERCEL_TOKEN" ]; then
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        else
          echo "VERCEL_TOKEN not configured. Skipping Vercel production deployment."
        fi

    - name: Install Playwright Chromium Browser
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E Tests
      run: npm run test:e2e
