name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "develop", "staging" ]
  pull_request:
    branches: [ "master", "main", "develop", "staging" ]

# Read-only token for every job: nothing here pushes, comments or releases.
# Migrations authenticate with their own Supabase secrets, not this token.
permissions:
  contents: read

env:
  # checkout and setup-node are on v5, which runs on Node 24 natively; before
  # that every run warned that they "target Node.js 20 but are being forced to
  # run on Node.js 24". This stays for supabase/setup-cli@v1, which has no such
  # release to move to.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validation
    # Pinned, not `latest`. GitHub moved `ubuntu-latest` to 26.04 and Playwright
    # 1.60 refuses to install on it ("does not support chromium on
    # ubuntu26.04-x64"), turning Validation red on an unrelated pull request —
    # the same shape as the Supabase CLI pin below. Bump deliberately, with the
    # Playwright version, not by whatever the runner image becomes overnight.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript Check
      run: npx tsc --noEmit
      
    - name: Run Unit & Integration Tests
      run: npm run test

    - name: Build project
      run: npm run build

    # E2E runs here, before any deploy, so it can actually gate a release.
    # The specs mock every Supabase call via Playwright route interception, so
    # these values only need to be internally consistent — no real project.
    # The browser download is cached, keyed on the installed Playwright version
    # and the runner image, since a browser build belongs to exactly one of
    # each. It usually takes about 25 seconds, but it is a download from a CDN
    # in the middle of the job and has taken four and a half minutes. The system
    # packages are not cacheable this way and are installed either way.
    - name: Read Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}

    - name: Install Playwright Chromium Browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Run Playwright E2E Tests
      env:
        VITE_SUPABASE_URL: https://ci-test.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpLXRlc3QiLCJyb2xlIjoiYW5vbiJ9.ci-signature
      run: npm run test:e2e


  rls:
    name: RLS Policy Tests
    # Pinned, not `latest`. GitHub moved `ubuntu-latest` to 26.04 and Playwright
    # 1.60 refuses to install on it ("does not support chromium on
    # ubuntu26.04-x64"), turning Validation red on an unrelated pull request —
    # the same shape as the Supabase CLI pin below. Bump deliberately, with the
    # Playwright version, not by whatever the runner image becomes overnight.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - uses: supabase/setup-cli@v1
      with:
        # Pinned, and pinned to the SAME major as the `supabase` devDependency
        # that `npx supabase` resolves in the migrate-production job below.
        # With `latest` here, the CLI releasing 3.0 turned this job red on an
        # unrelated pull request; pinning it to 3.0.0 then split the two jobs
        # across major versions, which broke the other one instead — 3.0 renamed
        # [inbucket] to [local_smtp] and 2.x rejects the new key.
        # tests/unit/supabaseCliVersion.test.ts asserts the two stay in step.
        version: 2.101.0

    # Spins up the real Postgres with every migration applied, which is the only
    # way to exercise row level security. The service key used elsewhere bypasses
    # RLS entirely and so cannot test it.
    - name: Start local Supabase
      run: supabase start

    - name: Run RLS tests
      run: supabase test db

    - name: Stop local Supabase
      if: always()
      run: supabase stop --no-backup

  migrate-production:
    name: Production Database Migration
    needs: validate
    # Pinned, not `latest`. GitHub moved `ubuntu-latest` to 26.04 and Playwright
    # 1.60 refuses to install on it ("does not support chromium on
    # ubuntu26.04-x64"), turning Validation red on an unrelated pull request —
    # the same shape as the Supabase CLI pin below. Bump deliberately, with the
    # Playwright version, not by whatever the runner image becomes overnight.
    runs-on: ubuntu-24.04
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    # Vercel's Git integration deploys the app itself; CI only owns migrations.
    - name: Link Production Database
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
      run: |
        if [ -z "$PROJECT_REF" ]; then
          echo "::error::SUPABASE_PROJECT_ID is not set. Add it under Settings → Secrets and variables → Actions."
          exit 1
        fi
        npx supabase link --project-ref "$PROJECT_REF"

    - name: Apply Production Migrations
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase db push
