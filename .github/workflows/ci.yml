name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "develop", "staging" ]
  pull_request:
    branches: [ "master", "main", "develop", "staging" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validation (Staging) Environment
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript Check
      run: npx tsc --noEmit
      
    - name: Run Unit & Integration Tests
      run: npm run test

    - name: Build project
      run: npm run build

    # E2E runs here, before any deploy, so it can actually gate a release.
    # The specs mock every Supabase call via Playwright route interception, so
    # these values only need to be internally consistent — no real project.
    - name: Install Playwright Chromium Browser
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E Tests
      env:
        VITE_SUPABASE_URL: https://ci-test.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpLXRlc3QiLCJyb2xlIjoiYW5vbiJ9.ci-signature
      run: npm run test:e2e

    # Apply Staging/Validation database migrations on develop/staging branches or PRs
    - name: Link Staging Database
      if: (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main') && github.event_name == 'push'
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
      run: |
        if [ -z "$PROJECT_REF" ]; then
          echo "::error::SUPABASE_STAGING_PROJECT_ID is not set. Add it under Settings → Secrets and variables → Actions."
          exit 1
        fi
        npx supabase link --project-ref "$PROJECT_REF"

    - name: Apply Staging/Validation Migrations
      if: (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main') && github.event_name == 'push'
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase db push

    # Optional Vercel Staging Deployment (Runs if secrets are configured)
    - name: Deploy Staging to Vercel
      if: (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main') && github.event_name == 'push'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "::error::VERCEL_TOKEN is not set, so nothing would be deployed. Add it under Settings → Secrets and variables → Actions."
          exit 1
        fi
        npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        npx vercel build --token="$VERCEL_TOKEN"
        npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    name: Production Environment Deployment
    needs: validate
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    # Apply Production database migrations before deploying
    - name: Link Production Database
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_ID }}
      run: |
        if [ -z "$PROJECT_REF" ]; then
          echo "::error::SUPABASE_PRODUCTION_PROJECT_ID is not set. Add it under Settings → Secrets and variables → Actions."
          exit 1
        fi
        npx supabase link --project-ref "$PROJECT_REF"

    - name: Apply Production Migrations
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase db push

    # Production Deployment on Vercel
    - name: Deploy Production to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "::error::VERCEL_TOKEN is not set, so nothing would be deployed. Add it under Settings → Secrets and variables → Actions."
          exit 1
        fi
        npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        npx vercel build --prod --token="$VERCEL_TOKEN"
        npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
