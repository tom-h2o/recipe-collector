name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "develop", "staging" ]
  pull_request:
    branches: [ "master", "main", "develop", "staging" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript Check
      run: npx tsc --noEmit
      
    - name: Run Unit & Integration Tests
      run: npm run test

    - name: Build project
      run: npm run build

    # E2E runs here, before any deploy, so it can actually gate a release.
    # The specs mock every Supabase call via Playwright route interception, so
    # these values only need to be internally consistent — no real project.
    - name: Install Playwright Chromium Browser
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E Tests
      env:
        VITE_SUPABASE_URL: https://ci-test.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpLXRlc3QiLCJyb2xlIjoiYW5vbiJ9.ci-signature
      run: npm run test:e2e


  migrate-production:
    name: Production Database Migration
    needs: validate
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    # Vercel's Git integration deploys the app itself; CI only owns migrations.
    - name: Link Production Database
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
      run: |
        if [ -z "$PROJECT_REF" ]; then
          echo "::error::SUPABASE_PROJECT_ID is not set. Add it under Settings → Secrets and variables → Actions."
          exit 1
        fi
        npx supabase link --project-ref "$PROJECT_REF"

    - name: Apply Production Migrations
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: npx supabase db push
